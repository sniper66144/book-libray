<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 我的书库</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">📚 我的书库</div>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="搜索书名 / 系列 / 标签 · 支持模糊 · 多关键词用空格分隔" autocomplete="off">
      <div id="searchDropdown" class="search-dropdown hidden"></div>
    </div>
    <div class="topbar-right">
      <span id="scanStatus" class="scan-status">扫描中…</span>
      <label class="toggle" title="自动刷新开关">
        <input id="autoRefresh" type="checkbox" checked>
        <span>自动刷新</span>
      </label>
      <button id="refreshBtn" class="btn-ghost" title="立即刷新">⟳</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左侧：系列树 -->
    <aside class="sidebar">
      <div class="side-title">系列分类</div>
      <ul id="seriesTree" class="tree"></ul>
    </aside>

    <!-- 右侧：内容区 -->
    <section class="content">
      <!-- 统计卡片 -->
      <div class="stat-cards" id="statCards"></div>

      <!-- 书籍列表（置于统计卡片下方、最近阅读上方） -->
      <div class="section" id="booksSection">
        <div class="section-head" id="booksSectionHead" title="点击收起 / 展开书籍列表">
          <h2 class="section-title" id="bookListTitle">📚 全部书籍</h2>
          <button id="toggleBooks" class="collapse-btn" title="收起书籍列表">▾</button>
        </div>
        <div class="table-wrap">
          <table id="booksTable" class="books-table">
            <thead>
              <tr>
                <th data-sort="title">书名</th>
                <th data-sort="series">系列</th>
                <th data-sort="ext">格式</th>
                <th data-sort="size">大小</th>
                <th data-sort="mtime">最近修改</th>
              </tr>
            </thead>
            <tbody id="booksTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 最近阅读 -->
      <div class="section">
        <h2 class="section-title">📖 最近阅读</h2>
        <div class="recent-grid">
          <div class="panel">
            <div class="panel-head">最近打开 <span class="hint">（在应用中点击打开时记录）</span></div>
            <ul id="recentOpenList" class="book-list"></ul>
          </div>
          <div class="panel">
            <div class="panel-head">最近修改 <span class="hint">（近 30 天 · 按文件修改日期）</span></div>
            <ul id="recentModifiedList" class="book-list"></ul>
          </div>
        </div>
      </div>

      <!-- 统计图表 -->
      <div class="section">
        <h2 class="section-title">📊 统计分析</h2>
        <div class="charts-grid">
          <div class="panel chart-panel">
            <div class="panel-head">各系列书籍数量</div>
            <div id="seriesBarChart" class="chart-box"></div>
          </div>
          <div class="panel chart-panel">
            <div class="panel-head">书籍格式分布</div>
            <div id="formatBarChart" class="chart-box"></div>
          </div>
          <div class="panel chart-panel chart-wide">
            <div class="panel-head">近 12 个月书籍新增 <span id="timelineNote" class="hint"></span></div>
            <div id="timelineChart" class="chart-box"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 书籍详情面板 -->
  <div id="detailPanel" class="detail-panel hidden">
    <div class="detail-head">
      <span id="detailTitle"></span>
      <button id="detailClose" class="btn-ghost">✕</button>
    </div>
    <div class="detail-body">
      <button id="detailOpen" class="btn-primary">📂 打开书籍</button>
      <dl class="detail-meta" id="detailMeta"></dl>
      <div class="detail-block">
        <div class="detail-label">打开记录</div>
        <div id="detailHistory" class="detail-history"></div>
      </div>
      <div class="detail-block">
        <div class="detail-label">标签</div>
        <div id="detailTags" class="tag-list"></div>
        <div class="tag-add-row">
          <input id="tagInput" type="text" placeholder="输入标签后回车…">
        </div>
      </div>
      <div class="detail-block">
        <div class="detail-label">备注</div>
        <textarea id="noteInput" rows="4" placeholder="写点关于这本书的笔记…"></textarea>
        <div class="detail-actions">
          <span id="noteSaveStatus" class="save-status"></span>
          <button id="noteSaveBtn" class="btn-primary">保存备注与标签</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 全局提示 -->
  <div id="toast" class="toast hidden"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
