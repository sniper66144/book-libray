<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 我的书库</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">📚 我的书库</div>
    <nav class="topbar-tabs" id="viewTabs" title="切换视图">
      <button type="button" class="tab-btn active" data-tab="books">📚 书库</button>
      <button type="button" class="tab-btn" data-tab="shows">🎬 追剧</button>
    </nav>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="搜索书名 / 系列 / 标签 · 支持模糊 · 多关键词用空格分隔" autocomplete="off">
      <div id="searchDropdown" class="search-dropdown hidden"></div>
    </div>
    <div class="topbar-right">
      <span id="scanStatus" class="scan-status">扫描中…</span>
      <label class="toggle" title="自动刷新开关">
        <input id="autoRefresh" type="checkbox" checked>
        <span>自动刷新</span>
      </label>
      <button id="refreshBtn" class="btn-ghost" title="立即刷新">⟳</button>
    </div>
  </header>

  <main class="layout">
    <!-- 视图一：书库（默认） -->
    <div class="view" id="view-books">
    <!-- 左侧：系列树 -->
    <aside class="sidebar">
      <div class="side-title">系列分类</div>
      <ul id="seriesTree" class="tree"></ul>
    </aside>

    <!-- 右侧：内容区 -->
    <section class="content">
      <!-- 统计卡片 -->
      <div class="stat-cards" id="statCards"></div>

      <!-- 书籍列表（置于统计卡片下方、最近阅读上方） -->
      <div class="section" id="booksSection">
        <div class="section-head" id="booksSectionHead" title="点击收起 / 展开书籍列表">
          <h2 class="section-title" id="bookListTitle">📚 全部书籍</h2>
          <button id="toggleBooks" class="collapse-btn" title="收起书籍列表">▾</button>
        </div>
        <div class="table-wrap">
          <table id="booksTable" class="books-table">
            <thead>
              <tr>
                <th data-sort="title">书名</th>
                <th data-sort="series">系列</th>
                <th data-sort="ext">格式</th>
                <th data-sort="size">大小</th>
                <th data-sort="mtime">最近修改</th>
              </tr>
            </thead>
            <tbody id="booksTbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 最近阅读 -->
      <div class="section">
        <h2 class="section-title">📖 最近阅读 <span id="readingStat" class="hint"></span></h2>
        <div class="recent-grid">
          <div class="panel">
            <div class="panel-head">最近打开 <span class="hint">（在应用中点击打开时记录）</span></div>
            <ul id="recentOpenList" class="book-list"></ul>
          </div>
          <div class="panel">
            <div class="panel-head">最近修改 <span class="hint">（近 30 天 · 按文件修改日期）</span></div>
            <ul id="recentModifiedList" class="book-list"></ul>
          </div>
        </div>
      </div>

      <!-- 统计图表 -->
      <div class="section">
        <h2 class="section-title">📊 统计分析</h2>
        <div class="charts-grid">
          <div class="panel chart-panel">
            <div class="panel-head">各系列书籍数量</div>
            <div id="seriesBarChart" class="chart-box"></div>
          </div>
          <div class="panel chart-panel">
            <div class="panel-head">书籍格式分布</div>
            <div id="formatBarChart" class="chart-box"></div>
          </div>
          <div class="panel chart-panel chart-wide">
            <div class="panel-head">近 12 个月书籍新增 <span id="timelineNote" class="hint"></span></div>
            <div id="timelineChart" class="chart-box"></div>
          </div>
        </div>
      </div>
    </section>
    </div><!-- /view-books -->

    <!-- 视图二：追剧（手动清单） -->
    <div class="view hidden" id="view-shows">
      <section class="content">
        <div class="show-header">
          <h2 class="section-title" id="showHeading">🎬 追剧清单</h2>
          <button id="showAddBtn" class="btn-primary" title="手动添加一部剧">＋ 添加剧集</button>
        </div>
        <div id="showSummary" class="show-summary"></div>
        <div id="showGroups"></div>
      </section>
    </div><!-- /view-shows -->
  </main>

  <!-- 书籍详情面板 -->
  <div id="detailPanel" class="detail-panel hidden">
    <div class="detail-head">
      <span id="detailTitle"></span>
      <button id="detailClose" class="btn-ghost">✕</button>
    </div>
    <div class="detail-body">
      <div class="detail-open-row">
        <button id="detailOpen" class="btn-primary">📂 打开书籍</button>
        <button id="finishToggle" class="btn-finish">标记读完</button>
      </div>
      <dl class="detail-meta" id="detailMeta"></dl>
      <div class="detail-block">
        <div class="detail-label">打开记录</div>
        <div id="detailHistory" class="detail-history"></div>
      </div>
      <div class="detail-block">
        <div class="detail-label">标签</div>
        <div id="detailTags" class="tag-list"></div>
        <div class="tag-add-row">
          <input id="tagInput" type="text" placeholder="输入标签后回车…">
        </div>
      </div>
      <div class="detail-block">
        <div class="detail-label">备注</div>
        <textarea id="noteInput" rows="4" placeholder="写点关于这本书的笔记…"></textarea>
        <div class="detail-actions">
          <span id="noteSaveStatus" class="save-status"></span>
          <button id="noteSaveBtn" class="btn-primary">保存备注与标签</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 剧集详情面板（右侧滑出，独立于书籍面板） -->
  <div id="showPanel" class="detail-panel hidden">
    <div class="detail-head">
      <span id="showPanelTitle">添加剧集</span>
      <button id="showPanelClose" class="btn-ghost">✕</button>
    </div>
    <div class="detail-body">
      <div class="show-form">
        <label>剧名
          <input id="showName" type="text" maxlength="100" placeholder="输入剧名…" autocomplete="off">
        </label>
        <label>状态
          <span class="seg" id="showStatusSeg">
            <button type="button" class="seg-btn" data-status="want">🍿 想看</button>
            <button type="button" class="seg-btn" data-status="watching">📺 正在看</button>
            <button type="button" class="seg-btn" data-status="done">✅ 已看完</button>
          </span>
        </label>
        <label>观看进度
          <span class="ep-row">看到第 <input id="showEpisode" type="number" min="0" step="1"> 集 / 共 <input id="showTotal" type="number" min="0" step="1"> 集</span>
        </label>
        <div class="date-row">
          <label>开始日期 <input id="showStart" type="date"></label>
          <label>看完日期 <input id="showFinish" type="date"></label>
        </div>
        <label>评分
          <span id="showRatingPicker" class="rating-picker" title="点击评分；再点当前分数可清除"></span>
        </label>
        <div class="detail-block">
          <div class="detail-label">标签</div>
          <div id="showTags" class="tag-list"></div>
          <div class="tag-add-row"><input id="showTagInput" type="text" placeholder="输入标签后回车…"></div>
        </div>
        <div class="detail-block">
          <div class="detail-label">备注</div>
          <textarea id="showNote" rows="4" placeholder="写点观剧随想…"></textarea>
        </div>
        <div class="detail-actions">
          <span id="showSaveStatus" class="save-status"></span>
          <button id="showSaveBtn" class="btn-primary">添加</button>
        </div>
        <div class="detail-delete-row">
          <button id="showDeleteBtn" class="btn-danger hidden-soft">🗑 删除这部剧</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 全局提示 -->
  <div id="toast" class="toast hidden"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
